<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathSnap | Route Reconstruction</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:Arial;margin:0;background:#f4f6fb;color:#182235}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:white;border-radius:14px;padding:18px;box-shadow:0 4px 18px #18223512}h1{margin:0 0 6px}p{color:#5b6575}select,button{padding:11px 14px;border:1px solid #cbd3df;border-radius:8px;font-size:15px}button{background:#243b70;color:white;border:0;cursor:pointer;margin-left:8px}#map{height:560px;margin-top:16px;border-radius:12px}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.metric{background:#eef2fb;padding:12px 16px;border-radius:9px}.legend{font-size:13px;color:#455}</style></head><body><div class="wrap"><div class="panel"><h1>PathSnap</h1><p>GPS map matching · road-network-aware route reconstruction</p><input id="api" value="" placeholder="API URL (blank = this host)" style="width:230px" aria-label="API URL"><select id="trip"></select><button onclick="run()">Reconstruct route</button><div id="status"></div><div class="metrics" id="metrics"></div><div class="legend">Blue: GPS observations · Orange: classifier route · Green: HMM/Viterbi route</div><div id="map"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const api=()=>((document.getElementById('api').value||window.location.origin).replace(/\/$/,''));const map=L.map('map').setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];async function init(){let r=await fetch(api()+'/trips'),d=await r.json();document.getElementById('trip').innerHTML=d.trips.map(x=>`<option>${x}</option>`).join('')}function clear(){layers.forEach(x=>map.removeLayer(x));layers=[]}async function run(){document.getElementById('status').textContent='Processing…';clear();let id=document.getElementById('trip').value;let r=await fetch(api()+'/predict/'+id);if(!r.ok){document.getElementById('status').textContent=await r.text();return}let d=await r.json();let gps=L.polyline(d.gps,{color:'#2774d8',weight:3,opacity:.8}).addTo(map);layers.push(gps);for(let seg of d.classifier_route){let l=L.polyline(seg,{color:'#e58a22',weight:4,opacity:.7}).addTo(map);layers.push(l)}for(let seg of d.predicted_route){let l=L.polyline(seg,{color:'#15945b',weight:5}).addTo(map);layers.push(l)}map.fitBounds(gps.getBounds(),{padding:[20,20]});document.getElementById('metrics').innerHTML=`<div class="metric"><b>GPS observations</b><br>${d.observation_count}</div><div class="metric"><b>Classifier route segments</b><br>${d.classifier_route.length}</div><div class="metric"><b>Viterbi route segments</b><br>${d.predicted_route.length}</div><div class="metric"><b>Decoded observations</b><br>${d.decoded_observations}</div>`;document.getElementById('status').textContent='Completed · '+id}init();</script></body></html>
